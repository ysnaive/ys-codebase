name: Publish Releases to Orphan Branch

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish-orphan
  cancel-in-progress: false

jobs:
  publish-releases:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch existing releases branch & short-circuit if no pending changes
        id: check_pending
        run: |
          if git ls-remote --exit-code --heads origin releases >/dev/null 2>&1; then
            git fetch --depth=1 origin releases:refs/remotes/origin/releases
          fi

          python3 - <<'PYEOF'
          import hashlib
          import json
          import os
          import re
          import subprocess

          SEMVER_RE = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$")
          VERSION_ASSIGN_RE = re.compile(r'^__version__\s*(?::\s*str\s*)?=\s*[\'"]([^\'"]+)[\'"]', re.MULTILINE)

          def parse_ver(v: str) -> tuple[int, int, int, int]:
              m = SEMVER_RE.match(v.strip())
              if not m:
                  return (0, 0, 0, 0)
              return (
                  int(m.group(1)),
                  int(m.group(2)),
                  int(m.group(3)),
                  int(m.group(4)) if m.group(4) is not None else 0,
              )

          def get_remote_files() -> set[str]:
              res = subprocess.run(
                  ["git", "ls-tree", "-r", "--name-only", "refs/remotes/origin/releases"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if res.returncode != 0:
                  return set()
              return {line.strip() for line in res.stdout.splitlines() if line.strip()}

          def get_remote_blob_bytes(rel_path: str) -> bytes | None:
              res = subprocess.run(
                  ["git", "show", f"refs/remotes/origin/releases:{rel_path}"],
                  capture_output=True,
                  check=False,
              )
              return res.stdout if res.returncode == 0 else None

          remote_files = get_remote_files()
          release_root = os.path.abspath("ys_codebase/release")
          needs_publish = False

          expected_remote_files: set[str] = {"yscb.py", "yscb.py.sha256"}
          if "yscb.py" not in remote_files or "yscb.py.sha256" not in remote_files:
              needs_publish = True
          else:
              with open("yscb.py", "r", encoding="utf-8") as hf:
                  loc_host_text = hf.read()
              rem_host_bytes = get_remote_blob_bytes("yscb.py")
              rem_host_text = rem_host_bytes.decode("utf-8", errors="replace") if rem_host_bytes else ""
              m_loc = VERSION_ASSIGN_RE.search(loc_host_text)
              m_rem = VERSION_ASSIGN_RE.search(rem_host_text)
              if m_loc and (not m_rem or parse_ver(m_loc.group(1)) > parse_ver(m_rem.group(1))):
                  needs_publish = True
          for mod in sorted(os.listdir(release_root)):
              mod_rel_dir = os.path.join(release_root, mod)
              idx_path = os.path.join(mod_rel_dir, "index.json")
              if not os.path.isdir(mod_rel_dir) or not os.path.isfile(idx_path):
                  continue
              expected_remote_files.add(f"{mod}/index.json")
              with open(idx_path, "rb") as f:
                  local_idx_bytes = f.read()
              remote_idx_bytes = get_remote_blob_bytes(f"{mod}/index.json")
              if remote_idx_bytes != local_idx_bytes:
                  needs_publish = True
              idx_data = json.loads(local_idx_bytes.decode("utf-8"))
              for ver in idx_data.get("versions", []):
                  v_str = str(ver).strip()
                  if v_str:
                      rel_zip = f"{mod}/{v_str}.zip"
                      expected_remote_files.add(rel_zip)
                      if rel_zip not in remote_files:
                          needs_publish = True

          if remote_files != expected_remote_files:
              needs_publish = True

          flag = "true" if needs_publish else "false"
          print(f"[release-publish] needs_publish={flag}")
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as out_f:
                  out_f.write(f"needs_publish={flag}\n")
          PYEOF

      - name: Restore existing release archives from releases branch
        if: steps.check_pending.outputs.needs_publish == 'true'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            for mod_dir in ys_codebase/release/*; do
              if [ -d "$mod_dir" ]; then
                mod_name="$(basename "$mod_dir")"
                git --work-tree=ys_codebase/release checkout refs/remotes/origin/releases -- "$mod_name" 2>/dev/null || true
              fi
            done
            git checkout HEAD -- "ys_codebase/release/**/index.json" || true
          fi

      - name: Package new releases and prune sliding window archives
        if: steps.check_pending.outputs.needs_publish == 'true'
        run: |
          python3 - <<'PYEOF'
          import fnmatch
          import hashlib
          import json
          import os
          import sys
          import zipfile

          DEFAULT_IGNORES = [
              "__pycache__", "*.pyc", "*.pyo", "*.tmp", "*.bak",
              ".git*", ".pytest_cache", ".DS_Store", ".yscbignore",
              "tests", "tests/*",
          ]
          TEXT_EXTENSIONS = (".py", ".json", ".md", ".txt", ".yaml", ".yml", ".toml", ".cfg", ".ini", ".sh")
          TEXT_BASENAMES = (".yscbignore", ".gitignore")
          ZIP_DATETIME = (2020, 1, 1, 0, 0, 0)
          ZIP_EXTERNAL_ATTR = (0o644 & 0xFFFF) << 16

          def should_ignore(rel_path: str, ignores: list[str]) -> bool:
              norm = rel_path.replace("\\", "/").rstrip("/")
              name = os.path.basename(norm)
              for pat in ignores:
                  p = pat.replace("\\", "/").rstrip("/")
                  if (
                      fnmatch.fnmatch(name, p)
                      or fnmatch.fnmatch(norm, p)
                      or fnmatch.fnmatch(norm, p + "/*")
                      or norm.startswith(p.rstrip("*").rstrip("/") + "/")
                  ):
                      return True
              return False

          def compute_sha256(file_path: str) -> str:
              h = hashlib.sha256()
              with open(file_path, "rb") as f:
                  while True:
                      chunk = f.read(65536)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest().lower()

          release_root = os.path.abspath("ys_codebase/release")
          source_root = os.path.abspath("ys_codebase/source")
          if not os.path.isdir(release_root):
              raise SystemExit(0)

          for mod in sorted(os.listdir(release_root)):
              mod_rel_dir = os.path.join(release_root, mod)
              idx_path = os.path.join(mod_rel_dir, "index.json")
              if not os.path.isdir(mod_rel_dir) or not os.path.isfile(idx_path):
                  continue
              with open(idx_path, "r", encoding="utf-8") as f:
                  idx_data = json.load(f)
              active_versions = set(idx_data.get("versions", []))
              src_dir = os.path.join(source_root, mod)
              src_mf_path = os.path.join(src_dir, "manifest.json")
              src_mf = None
              if os.path.isfile(src_mf_path):
                  with open(src_mf_path, "r", encoding="utf-8") as f:
                      src_mf = json.load(f)

              idx_updated = False
              releases_map = idx_data.get("releases")
              if not isinstance(releases_map, dict):
                  releases_map = {}
                  idx_data["releases"] = releases_map
                  idx_updated = True

              src_ver_str = str(src_mf.get("version", "")).strip() if src_mf else ""
              superseded_versions: set[str] = set()

              for ver in sorted(active_versions):
                  zip_path = os.path.join(mod_rel_dir, f"{ver}.zip")
                  if os.path.isfile(zip_path):
                      continue
                  if src_mf and src_ver_str == ver:
                      ignores = list(DEFAULT_IGNORES)
                      ignore_file = os.path.join(src_dir, ".yscbignore")
                      if os.path.isfile(ignore_file):
                          with open(ignore_file, "r", encoding="utf-8", errors="ignore") as igf:
                              for line in igf:
                                  s = line.strip()
                                  if s and not s.startswith("#"):
                                      ignores.append(s)
                      entries = []
                      for root, dirs, files in os.walk(src_dir):
                          rel_d = os.path.relpath(root, src_dir).replace("\\", "/")
                          if rel_d == ".":
                              rel_d = ""
                          dirs[:] = sorted(d for d in dirs if not should_ignore(f"{rel_d}/{d}".lstrip("/"), ignores))
                          for fname in sorted(files):
                              rel_f = f"{rel_d}/{fname}".lstrip("/")
                              if not should_ignore(rel_f, ignores):
                                  entries.append((rel_f, os.path.join(root, fname)))
                      entries.sort(key=lambda item: item[0])
                      with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
                          for rel_f, src_file_path in entries:
                              zinfo = zipfile.ZipInfo(filename=rel_f, date_time=ZIP_DATETIME)
                              zinfo.compress_type = zipfile.ZIP_DEFLATED
                              zinfo.external_attr = ZIP_EXTERNAL_ATTR
                              if rel_f == "manifest.json":
                                  m_copy = dict(src_mf)
                                  m_copy["version"] = ver
                                  payload = json.dumps(m_copy, indent=2, ensure_ascii=False).replace("\r\n", "\n").encode("utf-8")
                              else:
                                  with open(src_file_path, "rb") as rf:
                                      raw_bytes = rf.read()
                                  if rel_f.endswith(TEXT_EXTENSIONS) or os.path.basename(rel_f) in TEXT_BASENAMES:
                                      try:
                                          payload = raw_bytes.decode("utf-8").replace("\r\n", "\n").encode("utf-8")
                                      except UnicodeDecodeError:
                                          payload = raw_bytes
                                  else:
                                      payload = raw_bytes
                              zf.writestr(zinfo, payload)
                      print(f"[release-publish] Packaged {mod}@{ver}.zip from source.")
                  else:
                      # Unpushed local intermediate revision superseded before reaching origin/releases
                      superseded_versions.add(ver)
                      rel_entry = releases_map.get(ver)
                      if isinstance(rel_entry, dict):
                          rel_entry["status"] = "pruned"
                      idx_updated = True
                      print(
                          f"[release-publish] Auto-pruned intermediate unpushed revision {mod}@{ver} "
                          f"(superseded by '{src_ver_str or 'N/A'}')."
                      )

              if superseded_versions:
                  active_versions -= superseded_versions
                  idx_data["versions"] = [
                      v for v in idx_data.get("versions", []) if str(v).strip() not in superseded_versions
                  ]
              for ver in sorted(active_versions):
                  zip_path = os.path.join(mod_rel_dir, f"{ver}.zip")
                  if not os.path.isfile(zip_path):
                      continue
                  actual_sha = compute_sha256(zip_path)
                  rel_entry = releases_map.get(ver)
                  if not isinstance(rel_entry, dict):
                      rel_entry = {"status": "active", "dependencies": {}}
                      releases_map[ver] = rel_entry
                      idx_updated = True
                  if rel_entry.get("sha256") != actual_sha:
                      rel_entry["sha256"] = actual_sha
                      idx_updated = True
              if idx_updated:
                  with open(idx_path, "w", encoding="utf-8", newline="\n") as f:
                      f.write(json.dumps(idx_data, indent=2, ensure_ascii=False).replace("\r\n", "\n") + "\n")

              for fname in os.listdir(mod_rel_dir):
                  if fname.endswith(".zip") and fname[:-4] not in active_versions:
                      os.remove(os.path.join(mod_rel_dir, fname))
                      print(f"[release-publish] Pruned non-active archive {mod}/{fname}")

          # Stage yscb.py and yscb.py.sha256 into release_root:
          # Only publish local yscb.py when its __version__ > published origin/releases:yscb.py (or when absent on origin/releases)
          import re
          import subprocess
          SEMVER_RE = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$")
          VERSION_ASSIGN_RE = re.compile(r'^__version__\s*(?::\s*str\s*)?=\s*[\'"]([^\'"]+)[\'"]', re.MULTILINE)
          def parse_ver(v: str) -> tuple[int, int, int, int]:
              m = SEMVER_RE.match(v.strip())
              if not m:
                  return (0, 0, 0, 0)
              return (
                  int(m.group(1)),
                  int(m.group(2)),
                  int(m.group(3)),
                  int(m.group(4)) if m.group(4) is not None else 0,
              )

          with open("yscb.py", "r", encoding="utf-8") as hf:
              local_host_lf = hf.read().replace("\r\n", "\n")
          m_loc = VERSION_ASSIGN_RE.search(local_host_lf)
          loc_ver_tuple = parse_ver(m_loc.group(1)) if m_loc else (0, 0, 0, 0)

          rem_res = subprocess.run(
              ["git", "show", "refs/remotes/origin/releases:yscb.py"],
              capture_output=True,
              check=False,
          )
          use_local_host = True
          if rem_res.returncode == 0 and rem_res.stdout:
              rem_host_lf = rem_res.stdout.decode("utf-8", errors="replace").replace("\r\n", "\n")
              m_rem = VERSION_ASSIGN_RE.search(rem_host_lf)
              rem_ver_tuple = parse_ver(m_rem.group(1)) if m_rem else (0, 0, 0, 0)
              if loc_ver_tuple <= rem_ver_tuple:
                  use_local_host = False
                  chosen_host_lf = rem_host_lf
              else:
                  chosen_host_lf = local_host_lf
          else:
              chosen_host_lf = local_host_lf

          staged_host_path = os.path.join(release_root, "yscb.py")
          staged_sha_path = os.path.join(release_root, "yscb.py.sha256")
          with open(staged_host_path, "w", encoding="utf-8", newline="\n") as out_hf:
              out_hf.write(chosen_host_lf)
          host_sha256 = hashlib.sha256(chosen_host_lf.encode("utf-8")).hexdigest().lower()
          with open(staged_sha_path, "w", encoding="utf-8", newline="\n") as out_sf:
              out_sf.write(f"{host_sha256}  yscb.py\n")
          print(f"[release-publish] Staged yscb.py (updated={use_local_host}, sha256={host_sha256[:12]}...)")
          PYEOF

      - name: Commit, force-push single-depth orphan releases branch, and run git gc
        if: steps.check_pending.outputs.needs_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp)"
          rm -f "$GIT_INDEX_FILE"
          export GIT_WORK_TREE="$(pwd)/ys_codebase/release"
          git add -f .
          TREE_SHA="$(git write-tree)"
          unset GIT_WORK_TREE
          rm -f "$GIT_INDEX_FILE"
          unset GIT_INDEX_FILE
          rm -f ys_codebase/release/yscb.py ys_codebase/release/yscb.py.sha256

          REMOTE_TREE_SHA=""
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            REMOTE_TREE_SHA="$(git rev-parse 'refs/remotes/origin/releases^{tree}' 2>/dev/null || true)"
          fi

          if [ -n "$REMOTE_TREE_SHA" ] && [ "$TREE_SHA" = "$REMOTE_TREE_SHA" ]; then
            echo "[release-publish] Tree SHA ($TREE_SHA) matches origin/releases. Skipping push."
            exit 0
          fi

          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          COMMIT_SHA="$(git commit-tree "$TREE_SHA" -m "chore(release): publish sliding-window release artifacts (${TARGET_SHA::7})")"
          git push --force origin "${COMMIT_SHA}:refs/heads/releases"
          git reflog expire --expire=now --all
          git gc --prune=now
