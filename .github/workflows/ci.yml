name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy tree-sitter tree-sitter-language-pack

      - name: Bootstrap YS-Codebase runtime environment
        run: |
          python yscb.py restore --force
          python yscb.py status

      - name: Run Contributes Schema & Architecture Compliance Checks
        run: |
          python yscb.py contributes check
          python yscb.py dev check --all

      - name: Run Module Test Suites (pytest)
        run: |
          export PYTHONPATH="$(pwd)/ys_codebase/source/core:$(pwd)/ys_codebase/source/dev:$(pwd)/ys_codebase/source/server:$(pwd)/ys_codebase/source/file-space:$(pwd)/ys_codebase/source/ast:$(pwd)/ys_codebase/source/knowledge-db:$(pwd)/ys_codebase/source/agents-workflow:$(pwd)"
          pytest \
            ys_codebase/source/core/tests \
            ys_codebase/source/file-space/tests \
            ys_codebase/source/ast/tests \
            ys_codebase/source/knowledge-db/tests \
            ys_codebase/source/server/tests \
            ys_codebase/source/dev/tests \
            ys_codebase/source/agents-workflow/tests \
            -q

